<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companies - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    if (requireAuth()) {
      renderNav('companies');

      crudPage({
        title: 'Companies', noun: 'Company', endpoint: '/companies',
        fields: [
          { name: 'name', label: 'Company name', type: 'text', required: true },
          { name: 'website', label: 'Website', type: 'text' },
          { name: 'location', label: 'Location', type: 'text' },
          { name: 'contact_person', label: 'Contact person', type: 'text' },
          { name: 'contact_email', label: 'Contact email', type: 'email' },
          { name: 'notes', label: 'Notes', type: 'textarea' },
        ],
        columns: [
          { label: 'Company', render: (r) => '<strong>' + esc(r.name) + '</strong>' },
          { label: 'Location', render: (r) => esc(r.location) },
          { label: 'Contact', render: (r) => esc(r.contact_person) },
          { label: 'Email', render: (r) => esc(r.contact_email) },
        ],
      });
    }
  </script>
</body>
</html>
