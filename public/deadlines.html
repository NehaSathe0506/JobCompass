<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadlines - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    if (requireAuth()) {
      renderNav('deadlines');

      crudPage({
        title: 'Deadlines', noun: 'Deadline', endpoint: '/deadlines',
        fields: [
          { name: 'application_id', label: 'Application', type: 'select', required: true, createOnly: true,
            optionsFrom: { endpoint: '/applications', label: (r) => r.company + ' - ' + r.role },
            emptyMsg: 'Add an application first (Applications page).' },
          { name: 'title', label: 'What is due?', type: 'text', required: true },
          { name: 'due_date', label: 'Due date', type: 'date', required: true },
          { name: 'is_done', label: 'Completed', type: 'checkbox' },
        ],
        columns: [
          { label: 'Company', render: (r) => '<strong>' + esc(r.company) + '</strong>' },
          { label: 'Role', render: (r) => esc(r.role) },
          { label: 'Task', render: (r) => esc(r.title) },
          { label: 'Due date', render: (r) => esc(r.due_date) },
          { label: 'Status', render: (r) => doneBadge(r.is_done) },
        ],
      });
    }
  </script>
</body>
</html>
