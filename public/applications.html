<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applications - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    if (requireAuth()) {
      renderNav('applications');

      crudPage({
        title: 'My Applications', noun: 'Application', endpoint: '/applications',
        filterField: 'status', filterOptions: ['Applied', 'Interview', 'Selected', 'Rejected'],
        fields: [
          { name: 'company_id', label: 'Company', type: 'select', required: true,
            optionsFrom: { endpoint: '/companies', label: (r) => r.name },
            emptyMsg: 'Add a company first (Companies page).' },
          { name: 'role', label: 'Role / position', type: 'text', required: true },
          { name: 'type', label: 'Type', type: 'select', required: true, options: ['Internship', 'Job'] },
          { name: 'status', label: 'Status', type: 'select', required: true, options: ['Applied', 'Interview', 'Selected', 'Rejected'] },
          { name: 'applied_date', label: 'Applied on', type: 'date' },
          { name: 'job_link', label: 'Job link', type: 'text' },
          { name: 'notes', label: 'Notes', type: 'textarea' },
        ],
        columns: [
          { label: 'Company', render: (r) => '<strong>' + esc(r.company) + '</strong>' },
          { label: 'Role', render: (r) => esc(r.role) },
          { label: 'Type', render: (r) => esc(r.type) },
          { label: 'Status', render: (r) => badge(r.status) },
          { label: 'Applied on', render: (r) => esc(r.applied_date) },
        ],
        extraActions: (r) => '<a class="btn btn-sm btn-outline-secondary me-1" href="application.html?id=' + r.id + '">View</a>',
      });
    }
  </script>
</body>
</html>
