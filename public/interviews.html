<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interviews - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>

  <script>
    if (requireAuth()) {
      renderNav('interviews');

      crudPage({
        title: 'Interviews', noun: 'Interview', endpoint: '/interviews',
        fields: [
          { name: 'application_id', label: 'Application', type: 'select', required: true, createOnly: true,
            optionsFrom: { endpoint: '/applications', label: (r) => r.company + ' - ' + r.role },
            emptyMsg: 'Add an application first (Applications page).' },
          { name: 'round_name', label: 'Round (e.g. Technical, HR)', type: 'text', required: true },
          { name: 'interview_date', label: 'Date and time', type: 'datetime-local', required: true },
          { name: 'mode', label: 'Mode', type: 'select', required: true, options: ['Online', 'Offline'] },
          { name: 'result', label: 'Result', type: 'select', required: true, options: ['Pending', 'Cleared', 'Rejected'] },
        ],
        columns: [
          { label: 'Company', render: (r) => '<strong>' + esc(r.company) + '</strong>' },
          { label: 'Role', render: (r) => esc(r.role) },
          { label: 'Round', render: (r) => esc(r.round_name) },
          { label: 'When', render: (r) => esc(fmtDateTime(r.interview_date)) },
          { label: 'Mode', render: (r) => esc(r.mode) },
          { label: 'Result', render: (r) => badge(r.result) },
        ],
      });
    }
  </script>
</body>
</html>
