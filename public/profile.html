<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadProfile() {
      const root = document.getElementById('app');
      try {
        const p = await api('/auth/profile');
        root.innerHTML = `
          <h2 class="page-title mb-3">My Profile</h2>
          <div class="card jc-card" style="max-width:520px"><div class="card-body">
            <form id="profileForm">
              <div class="mb-3"><label class="form-label">Name *</label>
                <input id="pName" class="form-control" value="${esc(p.name)}" required></div>
              <div class="mb-3"><label class="form-label">Email</label>
                <input class="form-control" value="${esc(p.email)}" disabled></div>
              <div class="mb-3"><label class="form-label">College</label>
                <input id="pCollege" class="form-control" value="${esc(p.college)}"></div>
              <div class="text-muted small mb-3">Member since ${esc(String(p.created_at).slice(0, 10))}</div>
              <button class="btn btn-primary" type="submit">Save changes</button>
            </form>
          </div></div>`;
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('pName').value.trim();
          const college = document.getElementById('pCollege').value.trim();
          try {
            await api('/auth/profile', 'PUT', { name, college });
            localStorage.setItem('jc_user', JSON.stringify({ ...currentUser(), name, college }));
            renderNav('profile');
            toast('Profile updated.');
          } catch (err) { toast(err.message, 'danger'); }
        });
      } catch (err) {
        root.innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>';
      }
    }
    if (requireAuth()) { renderNav('profile'); loadProfile(); }
  </script>
</body>
</html>
