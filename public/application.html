<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Details - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function loadDetails() {
      const root = document.getElementById('app');
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { root.innerHTML = '<div class="alert alert-warning">No application selected. <a href="applications.html">Go back</a></div>'; return; }
      try {
        const a = await api('/applications/' + encodeURIComponent(id));

        const table = (title, link, head, rowsHtml) => `
          <div class="card jc-card mb-3"><div class="card-header bg-white d-flex justify-content-between">
            <span class="fw-semibold">${title}</span><a href="${link}" class="small">Manage</a></div>
            ${rowsHtml ? `<div class="table-responsive"><table class="table mb-0"><thead><tr>${head.map((h) => '<th>' + h + '</th>').join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`
                       : '<div class="text-muted p-3">Nothing added yet.</div>'}
          </div>`;

        root.innerHTML = `
          <a href="applications.html" class="small">&larr; Back to applications</a>
          <div class="d-flex flex-wrap justify-content-between align-items-center my-3 gap-2">
            <h2 class="page-title mb-0">${esc(a.company)} - ${esc(a.role)}</h2>
            <div class="d-flex align-items-center gap-2">
              <label class="mb-0 text-muted">Status</label>
              <select id="statusSel" class="form-select w-auto">
                ${['Applied', 'Interview', 'Selected', 'Rejected'].map((s) => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="card jc-card mb-3"><div class="card-body">
            <div class="row g-3">
              <div class="col-md-3"><div class="text-muted small">Type</div>${esc(a.type)}</div>
              <div class="col-md-3"><div class="text-muted small">Status</div>${badge(a.status)}</div>
              <div class="col-md-3"><div class="text-muted small">Applied on</div>${esc(a.applied_date) || '-'}</div>
              <div class="col-md-3"><div class="text-muted small">Job link</div>${a.job_link ? '<a target="_blank" rel="noopener noreferrer" href="' + esc(a.job_link) + '">Open</a>' : '-'}</div>
              <div class="col-12"><div class="text-muted small">Notes</div>${esc(a.notes) || '-'}</div>
            </div>
          </div></div>
          ${table('Deadlines', 'deadlines.html', ['Task', 'Due', 'Status'],
            a.deadlines.map((d) => `<tr><td>${esc(d.title)}</td><td>${esc(d.due_date)}</td><td>${doneBadge(d.is_done)}</td></tr>`).join(''))}
          ${table('Follow-ups', 'follow-ups.html', ['Date', 'Method', 'Note', 'Status'],
            a.followUps.map((f) => `<tr><td>${esc(f.follow_up_date)}</td><td>${esc(f.method)}</td><td>${esc(f.note)}</td><td>${doneBadge(f.is_done)}</td></tr>`).join(''))}
          ${table('Interviews', 'interviews.html', ['Round', 'When', 'Mode', 'Result'],
            a.interviews.map((i) => `<tr><td>${esc(i.round_name)}</td><td>${esc(fmtDateTime(i.interview_date))}</td><td>${esc(i.mode)}</td><td>${badge(i.result)}</td></tr>`).join(''))}`;

        // Quick status change (the "Track Application Status" feature)
        document.getElementById('statusSel').addEventListener('change', async (e) => {
          try {
            await api('/applications/' + encodeURIComponent(id), 'PUT', {
              company_id: a.company_id, role: a.role, type: a.type, status: e.target.value,
              applied_date: a.applied_date, job_link: a.job_link, notes: a.notes,
            });
            toast('Status updated.');
            loadDetails();
          } catch (err) { toast(err.message, 'danger'); }
        });
      } catch (err) {
        root.innerHTML = '<div class="alert alert-danger">' + esc(err.message) + ' <a href="applications.html">Go back</a></div>';
      }
    }
    if (requireAuth()) { renderNav('applications'); loadDetails(); }
  </script>
</body>
</html>
