<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobCompass - Placement Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrap px-3">
    <div class="login-card">
      <div class="text-center mb-4">
        <h1 class="brand mb-0">JobCompass</h1>
        <div class="text-muted">Placement Tracker</div>
      </div>
      <div class="card jc-card"><div class="card-body p-4">
        <ul class="nav nav-pills nav-fill mb-4">
          <li class="nav-item"><button class="nav-link active" id="tabLogin" type="button">Login</button></li>
          <li class="nav-item"><button class="nav-link" id="tabRegister" type="button">Register</button></li>
        </ul>

        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" required></div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

        <form id="registerForm" class="d-none">
          <div class="mb-3"><label class="form-label">Full name</label>
            <input type="text" id="regName" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" id="regEmail" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">College (optional)</label>
            <input type="text" id="regCollege" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Password (min 6 characters)</label>
            <input type="password" id="regPassword" class="form-control" minlength="6" required></div>
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
      </div></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    if (localStorage.getItem('jc_token')) window.location.href = 'dashboard.html';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');

    function showTab(isLogin) {
      loginForm.classList.toggle('d-none', !isLogin);
      registerForm.classList.toggle('d-none', isLogin);
      tabLogin.classList.toggle('active', isLogin);
      tabRegister.classList.toggle('active', !isLogin);
    }
    tabLogin.addEventListener('click', () => showTab(true));
    tabRegister.addEventListener('click', () => showTab(false));

    function saveSession(data) {
      localStorage.setItem('jc_token', data.token);
      localStorage.setItem('jc_user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        saveSession(await api('/auth/login', 'POST', {
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value,
        }));
      } catch (err) { toast(err.message, 'danger'); }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        saveSession(await api('/auth/register', 'POST', {
          name: document.getElementById('regName').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          college: document.getElementById('regCollege').value.trim(),
          password: document.getElementById('regPassword').value,
        }));
      } catch (err) { toast(err.message, 'danger'); }
    });
  </script>
</body>
</html>
