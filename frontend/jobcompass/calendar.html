<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar - JobCompass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <main class="container py-4" id="app"><div class="text-muted">Loading...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const events = {};          // { 'YYYY-MM-DD': [ {type, text} ] }
    let view = new Date(); view.setDate(1);

    function addEvent(date, type, text) {
      if (!date) return;
      const key = String(date).slice(0, 10);
      (events[key] = events[key] || []).push({ type, text });
    }

    function drawCalendar() {
      const y = view.getFullYear(), m = view.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const today = new Date();
      const todayKey = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += '<div class="cal-cell empty"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const evs = (events[key] || []).map((e) => `<div class="ev ev-${e.type}" title="${esc(e.text)}">${esc(e.text)}</div>`).join('');
        cells += `<div class="cal-cell ${key === todayKey ? 'today' : ''}"><div class="cal-day">${d}</div>${evs}</div>`;
      }

      document.getElementById('app').innerHTML = `
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h2 class="page-title mb-0">Calendar</h2>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-primary btn-sm" id="prevM">&laquo;</button>
            <strong style="min-width:150px;text-align:center">${view.toLocaleString('default', { month: 'long' })} ${y}</strong>
            <button class="btn btn-outline-primary btn-sm" id="nextM">&raquo;</button>
          </div>
        </div>
        <div class="mb-3 small">
          <span class="me-3"><span class="legend-dot ev-deadline"></span>Deadline</span>
          <span class="me-3"><span class="legend-dot ev-follow"></span>Follow-up</span>
          <span><span class="legend-dot ev-interview"></span>Interview</span>
        </div>
        <div class="cal-grid">
          ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((n) => '<div class="cal-head">' + n + '</div>').join('')}
          ${cells}
        </div>`;
      document.getElementById('prevM').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); drawCalendar(); });
      document.getElementById('nextM').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); drawCalendar(); });
    }

    async function loadCalendar() {
      try {
        const [deadlines, followUps, interviews] = await Promise.all([
          api('/deadlines'), api('/follow-ups'), api('/interviews'),
        ]);
        deadlines.forEach((r) => addEvent(r.due_date, 'deadline', r.company + ': ' + r.title));
        followUps.forEach((r) => addEvent(r.follow_up_date, 'follow', r.company + ' (' + r.method + ')'));
        interviews.forEach((r) => addEvent(r.interview_date, 'interview', String(r.interview_date).slice(11, 16) + ' ' + r.company));
        drawCalendar();
      } catch (err) {
        document.getElementById('app').innerHTML = '<div class="alert alert-danger">Could not load calendar: ' + esc(err.message) + '</div>';
      }
    }
    if (requireAuth()) { renderNav('calendar'); loadCalendar(); }
  </script>
</body>
</html>
